name: Update README

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 대해 동시에 한 개만 돌린다.
# 문제를 연달아 풀어 푸시가 여러 번 들어와도 마지막 실행만 남는다.
# (README 생성은 몇 번 돌려도 같은 결과라 이전 실행을 취소해도 안전)
concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 워크플로우가 만든 커밋 때문에 다시 돌지 않도록
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 커밋 날짜 계산에 전체 히스토리가 필요

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate README
        run: python3 update_readme.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .solved_dates.json links.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "docs: update README [skip ci]"

          # 그 사이 확장 프로그램이 새 커밋을 밀어넣었을 수 있으니
          # rebase 로 얹은 뒤 재시도한다
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공 (${i}번째 시도)"
              exit 0
            fi
            echo "재시도 ${i}..."
            sleep $(( RANDOM % 10 + 5 ))
          done

          echo "5회 시도 후 실패"
          exit 1
